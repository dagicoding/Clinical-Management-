<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nurse</title>
</head>
<body>

    <h1>Hi, nurse</h1>
    {% for visit in visits  %}
    <div class="form-group">
        <h3>{{visit.patient.name}}</h3>
        <a href="{% url 'nurseVital' visit.id %}">Treat Patient</a>
    </div>
    {% empty %}
        <h4>no visits</h4>
    {% endfor %}
    

    
</body>
</html>
