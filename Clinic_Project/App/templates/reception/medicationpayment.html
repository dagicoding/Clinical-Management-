<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med pay List</title>
</head>
<body>
    <h1>Hi, reception</h1>
    <div class="content" style="display:flex; wrap:wrap; gap:10px;">
        {% for medication in medications %}
        <div class="form-group" style = "padding:5px; text-align:center; border:1px solid black; width:100px;">
            <p>{{medication.visit.patient.name}}</p>
            <a href="{% url 'medicationpaydetail' medication.visit.id %}">view</a>
        </div>
        {% endfor %}
    </div>
    

    
</body>
</html>
