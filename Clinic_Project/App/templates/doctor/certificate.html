<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>certificate</title>
</head>
<body>
    <h1>Certificate for {{visit.patient.name}}</h1>
    <form action="{% url 'certificate' visit.id %}" method ="POST">
        {% csrf_token %}
        {{form.as_p}}
        <button>save Medical certificate</button>
        <button><a href="{% url 'certificatePrint' visit.id %}">Print</a></button>
    </form>
    
    
</body>
</html>
